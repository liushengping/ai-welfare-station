name: welfare-radar

# GitHub 会把高频 cron 降频到 ~4次/天，因此采用"循环驻留"模式：
# 每次被调度后，在 Runner 内部每 15 分钟抓一轮、连续驻留约 5.9 小时（job 上限 6h）。
# 4 次/天 × ~23 轮 ≈ 90+ 次检查/天 ≈ 真·15分钟节奏。公共仓库 Actions 免费不计费。
on:
  schedule:
    - cron: "*/30 0-15 * * *"   # 实际触发会被 GitHub 降频，由驻留循环补齐
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: welfare-radar
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 驻留轮询（每15分钟一轮 × 23轮）
        working-directory: watcher
        timeout-minutes: 350
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          git config user.name "welfare-bot"
          git config user.email "actions@users.noreply.github.com"
          END=$(( $(date -u +%s) + 21000 ))   # 驻留约 5 小时 50 分钟（job 上限 6h）
          i=0
          while [ $(date -u +%s) -lt $END ]; do
            i=$((i+1))
            echo "===== 第 $i 轮 $(TZ=Asia/Shanghai date '+%F %T') ====="
            python -u watch.py || true
            # 每轮回写 state/feed（去重基线跨轮持久；冲突时以远端为准放弃本地，最坏损失一轮去重）
            git add -A || true
            git diff --cached --quiet || git commit -m "radar: update state [skip ci]" || true
            git pull --rebase -q origin main || { git rebase --abort 2>/dev/null || true; git fetch origin && git reset --hard origin/main; }
            git push -q origin main || echo "[warn] push failed, will retry next round"
            # 周五晚（北京时间 18 点后）是智谱 Weekend Build 等活动的高发窗口，切 5 分钟一轮蹲守
            DOW=$(TZ=Asia/Shanghai date +%u); HOUR=$(TZ=Asia/Shanghai date +%H)
            if [ "$DOW" = "5" ] && [ "$HOUR" -ge 18 ]; then SLEEP=300; else SLEEP=840; fi
            REMAIN=$(( END - $(date -u +%s) ))
            [ $REMAIN -le 0 ] && break
            [ $SLEEP -gt $REMAIN ] && SLEEP=$REMAIN
            sleep $SLEEP
          done
